name: Deploy Node.js Docker App (Production) a

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        script: |                    
          cd /root/FirewallAmbientesV2/backend-api

          git config --global user.name "${{ secrets.GIT_USERNAME }}"
          git config --global user.email "noreply@github.com"
          git remote set-url origin https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_TOKEN }}@github.com/Hostly-Network/Backend-FirewallOVH-APIREST.git

          git fetch --all
          git reset --hard origin/main
          git pull origin main

          docker compose -f docker-compose.yml up -d --build
          docker image prune -fge prune -f --filter "label!=db"