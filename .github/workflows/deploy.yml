name: Deploy Node.js Docker App (Production)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        script: |                    
          cd /root/FirewallAmbientesV2/backend-api

          git fetch --all
          git reset --hard origin/main
          git pull origin main

          docker compose -f docker-compose.yml up -d --build
          docker image prune -fge prune -f --filter "label!=db"